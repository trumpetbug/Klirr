<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klirr">
<meta name="theme-color" content="#0f0e12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
<title>Klirr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: eine Bühnenfläche, riesiger Cue Button in der Mitte, Einstellungen darunter. Bewusst nur dunkel (Bühne). */
:root{
  --stage:#0f0e12; --panel:#1a1820; --line:#2c2934; --text:#efeae0; --muted:#9a94a3;
  --glass:#9fd8d2; --glass-deep:#3f7f7a; --live:#ff5a3c;
  --display:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--text);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:22px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.status.ready .dot{background:var(--glass)}
.status.playing .dot{background:var(--live);box-shadow:0 0 10px var(--live)}

.cue{appearance:none;border:0;cursor:pointer;width:100%;aspect-ratio:1/1;max-height:60vh;max-width:100%;margin:0 auto;border-radius:50%;
  background:radial-gradient(circle at 50% 36%, #e6fbf8 0%, var(--glass) 42%, var(--glass-deep) 100%);
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.5);
  display:grid;place-items:center;color:#0c1f1d;transition:transform .05s;touch-action:manipulation}
.cue:active,.cue.hit{transform:scale(.97);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), 0 8px 20px rgba(0,0,0,.5)}
.cue.playing{background:radial-gradient(circle at 50% 36%, #ffb39f 0%, var(--live) 50%, #a3291a 100%);color:#1b0805}
.cue:focus-visible{outline:3px solid var(--text);outline-offset:6px}
.cue span{font-family:var(--display);font-weight:900;font-size:clamp(40px,14vw,76px);letter-spacing:.06em;text-transform:uppercase;line-height:.9;text-align:center;display:block}
.cue small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.08em;margin-top:10px;font-weight:500;max-width:220px;margin-inline:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass);color:#0c1f1d;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
input[type=range]{flex:1;accent-color:var(--glass);min-width:140px}
.vol{font-family:var(--mono);font-size:13px;width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.file{font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.keys{font-size:13px;color:var(--muted);line-height:1.55}
.keys b{color:var(--text);font-weight:600}
kbd{font-family:var(--mono);font-size:12px;background:var(--stage);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text)}
.last{font-family:var(--mono);color:var(--glass)}
@media (prefers-reduced-motion:reduce){.cue{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Sound Cue</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Lädt</span></div>
  </header>

  <button class="cue" id="cue" aria-label="Sound abspielen"><div><span>Klirr</span><small id="cueName">Bierflasche zerschellt</small></div></button>

  <section class="panel">
    <div class="row">
      <span class="lbl">Sound</span>
      <div class="seg" role="group" aria-label="Sound wählen">
        <button id="sSmash" aria-pressed="true">Flasche 1</button>
        <button id="sShatter" aria-pressed="false">Flasche 2</button>
        <button id="sFile" aria-pressed="false" hidden>Eigener</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Lautstärke</span>
      <input type="range" id="volume" min="0" max="150" value="100">
      <span class="vol" id="volText">100 %</span>
    </div>
    <div class="keys">
      <b>Fußschalter:</b> löst bei jeder Taste aus, z.B. <kbd>Leertaste</kbd> <kbd>Enter</kbd> <kbd>Pfeil</kbd> <kbd>Bild ↓</kbd>. Vor dem Auftritt einmal auf den Button tippen, bis oben <b>Bereit</b> steht. <kbd>Esc</kbd> stoppt.<br>
      Letzte Taste: <span class="last" id="lastKey">keine</span>
    </div>
    <label class="file" for="fileInput">Andere Aufnahme laden<input type="file" id="fileInput" accept="audio/*"></label>
  </section>
</div>

    if (document.visibilityState==='visible' && wakeLock && wakeLock.released){
      wakeLock = null; if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{}); }
  });
})();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
